---
# CI for @druxt/dui.
#
# The shape is the Druxt module one, less the jobs that need an application:
# this package has no example to generate, so there is nothing for end to end,
# visual or preview jobs to run against. They arrive with the Storybook build,
# which is what will give this repository something to look at.
#
# There is no GitHub mirror yet, so lint:yaml covers this file alone and
# actionlint is absent rather than pointed at nothing.
#
# Secret scanning is gitleaks, not GitLab's Security/Secret-Detection template.
# That template is an Ultimate-tier feature: on a non-Ultimate instance the
# include produces no job at all, so the configuration reads as coverage while
# scanning nothing.

stages:
  - lint
  - build

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

default:
  tags: [docker]
  timeout: 15m
  before_script:
    - 'section_start() { local n="$1" t="${2:-$1}"; printf "\e[0Ksection_start:%s:%s\r\e[0K%s\n" "$(date +%s)" "$n" "$t"; }'
    - 'section_end() { printf "\e[0Ksection_end:%s:%s\r\e[0K\n" "$(date +%s)" "$1"; }'

# Shared Node setup. The cache is keyed by the lockfile hash: a dependency
# bump misses once and hits thereafter.
.node:
  image: node:16.20.1
  interruptible: true
  cache:
    key:
      files:
        - package-lock.json
      prefix: node-16.20.1
    paths:
      - .npm/
  before_script:
    - !reference [default, before_script]
    - corepack enable
    - corepack prepare --activate
    - npm ci --cache .npm --prefer-offline

#
# --- Lint ---
#

lint:js:
  extends: .node
  stage: lint
  script:
    - section_start "eslint" "Linting sources and runtime files"
    - npm run lint:js
    - section_end "eslint"

lint:format:
  extends: .node
  stage: lint
  script:
    - section_start "prettier" "Checking formatting"
    - npm run lint:format
    - section_end "prettier"

lint:md:
  extends: .node
  stage: lint
  script:
    - section_start "markdownlint" "Linting Markdown"
    - npm run lint:md
    - section_end "markdownlint"

lint:cspell:
  extends: .node
  stage: lint
  script:
    - section_start "cspell" "Spell checking"
    - npm run lint:cspell
    - section_end "cspell"

# This package is published, and its README is what people read first. A host
# only the author can reach must never reach a tracked file.
lint:private:
  extends: .node
  stage: lint
  script:
    - section_start "private-refs" "Checking for private host references"
    - npm run lint:private
    - section_end "private-refs"

lint:knip:
  extends: .node
  stage: lint
  script:
    - section_start "knip" "Checking for unused and undeclared dependencies"
    - npm run lint:knip
    - section_end "knip"

# Production only. A shipped runtime dependency is what actually reaches a
# consumer, and a devDependency advisory is worth knowing about without
# blocking a merge request.
#
# Report-only, as the druxtjs.org frontend's audit is and for the same reason.
# npm installs a missing peer, so `nuxt` and its whole Nuxt 2 tree land in the
# production graph and every advisory in it is reported here: 26 high or
# critical, all of them @nuxt/* or packages those pull. Nuxt 2 reached end of
# life, so none of them will be fixed, and a gate that can only ever be red
# teaches people to ignore it. It goes back to blocking when this package
# builds for Nuxt 3.
lint:audit:
  extends: .node
  stage: lint
  allow_failure: true
  script:
    - section_start "audit" "Auditing shipped dependencies"
    - npm run lint:audit
    - section_end "audit"

lint:yaml:
  stage: lint
  image: python:3.12-slim
  interruptible: true
  script:
    - section_start "yamllint" "Linting YAML"
    - pip install --quiet yamllint
    - yamllint .gitlab-ci.yml
    - section_end "yamllint"

# The merge request's own commits, not the whole history. This repository
# squash-merges, so a prose title becomes the commit subject and breaks the
# next push to the target branch.
lint:commit:
  extends: .node
  stage: lint
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  script:
    - section_start "commitlint" "Validating commit messages"
    - git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" --depth 50
    - npm run lint:commit -- --from "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" --to HEAD --verbose
    - section_end "commitlint"

# The work is the author's. No commit, merge request description or tracked
# file may credit an AI tool as author, co-author or generator.
lint:attribution:
  image: node:16.20.1
  stage: lint
  interruptible: true
  variables:
    GIT_DEPTH: 0
  script:
    - section_start "attribution" "Checking for AI attribution"
    - bash .gitlab/scripts/check-attribution.sh
    - section_end "attribution"

lint:prose:
  image: node:16.20.1
  stage: lint
  interruptible: true
  variables:
    GIT_DEPTH: 0
    PROSE_LINT_GLOB: "!.changeset/**"
  cache:
    key: vale-3.17.1
    paths:
      - .vale/
  script:
    - section_start "prose" "Linting prose with Vale"
    - bash .gitlab/scripts/install-vale.sh .vale/bin .vale/styles
    - bash .gitlab/scripts/lint-prose.sh
    - section_end "prose"

#
# --- Build ---
#

build:
  extends: .node
  stage: build
  needs: []
  script:
    - section_start "build" "Building the module"
    - npm run build
    - section_end "build"
    # Each exports entry is a build target whose source siroc takes from the
    # matching subpath under src/. A missing one leaves the module resolving a
    # path that is not there, which surfaces in a consumer's build rather than
    # in this one, so every runtime path the module names is checked here.
    - section_start "emitted" "Checking the build emitted every runtime path"
    - test -f dist/index.ssr.js && test -f dist/tailwind-preset.js
    - test -f dist/layouts/docs.vue
    - test -f dist/plugins/store.mjs
    - test -f dist/plugins/content-links.client.mjs
    - test -f dist/plugins/copy-buttons.client.mjs
    - test -f dist/plugins/color-mode-theme.client.mjs
    - test -f dist/utils/copy-button.mjs
    - test -d dist/assets/css && test -d dist/components
    - test "$(find dist/components -name '*.vue' | wc -l)" -ge 18
    - section_end "emitted"
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

# A published install runs the package's own scripts and reads its files
# allowlist; a link install does neither, so this is the only job that proves
# the package a consumer downloads can install and resolve.
build:pack:
  extends: .node
  stage: build
  needs: []
  script:
    - section_start "build" "Building the module"
    - npm run build
    - section_end "build"
    - section_start "pack" "Packing and installing the tarball"
    - npm pack
    - mkdir -p "$CI_PROJECT_DIR/pack-check" && mv ./*.tgz "$CI_PROJECT_DIR/pack-check/pkg.tgz"
    - cd "$CI_PROJECT_DIR/pack-check" && npm init -y > /dev/null
    - npm install ./pkg.tgz --legacy-peer-deps --no-audit --no-fund
    - PKG=$(node -p "require('$CI_PROJECT_DIR/package.json').name")
    - node -e "require.resolve('$PKG')"
    - node -e "require.resolve('$PKG/tailwind-preset')"
    # The files allowlist has already omitted a runtime plugin once. A missing
    # one installs cleanly and fails only in a consumer's build.
    - test -f "node_modules/$PKG/dist/plugins/copy-buttons.client.mjs"
    - test -f "node_modules/$PKG/dist/plugins/color-mode-theme.client.mjs"
    - test -f "node_modules/$PKG/dist/plugins/content-links.client.mjs"
    - test -f "node_modules/$PKG/dist/utils/copy-button.mjs"
    - test -f "node_modules/$PKG/dist/layouts/docs.vue"
    - section_end "pack"

#
# --- Secret detection ---
#

secret-detection:
  stage: lint
  image: alpine:3.21
  interruptible: true
  dependencies: []
  variables:
    GITLEAKS_VERSION: '8.30.1'
    GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
  script:
    - section_start "gitleaks" "Scanning for committed secrets"
    - apk add --no-cache curl tar git > /dev/null
    - curl -sSLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
    - echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
    - tar -xzf gitleaks.tar.gz gitleaks
    - ./gitleaks detect --source . --no-banner --redact --verbose
    - section_end "gitleaks"
    # A scan that finds nothing looks identical to a scan that cannot find
    # anything. Plant three credentials outside the repository and assert all
    # three are reported, so a bad download, a config change or a widened
    # allowlist fails the job instead of passing it quietly.
    #
    # Each value is split across its own prefix so no fragment in this file
    # triggers the rule it is meant to exercise.
    - section_start "canary" "Checking that the scanner still detects"
    - |
      canary="$(mktemp -d)"
      pat="gh""p_8fK2mQ7xR4tV9nB3jH6yW1sZ5cD8gL0aE4uY"
      stripe="sk""_live_51aBcD2eFgH3iJkL4mNoP5qR6sTuV7wXyZ8a"
      slack="xo""xb-263594753641-2529420432-J1n4h6a9pQrStUvWxYz1AbCd"
      printf 'a = "%s"\nb = "%s"\nc = "%s"\n' "$pat" "$stripe" "$slack" > "$canary/canary.txt"
      ./gitleaks detect --no-git --source "$canary" --no-banner --redact \
        --report-format json --report-path "$canary/report.json" || true
      found=$(grep -c '"RuleID"' "$canary/report.json" || true)
      rm -rf "$canary"
      if [ "$found" != "3" ]; then
        echo "The canary planted 3 credentials and gitleaks reported $found."
        echo "The scan above proves nothing while this is true."
        exit 1
      fi
      echo "Canary detected 3 of 3 planted credentials."
    - section_end "canary"
