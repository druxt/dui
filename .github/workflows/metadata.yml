---
name: Metadata

# The title and description checks, on the events that change either field.
#
# `ci.yml` runs the description checks too, but on the default pull_request
# activity types, which do not include `edited`. A description edited after a
# green run is never looked at again, and an attribution footer added there is
# exactly what the attribution check exists to catch. The title is checked only
# here, because a title exists nowhere in a push.
#
# A separate workflow rather than `edited` on ci.yml. Adding it there means
# every bot that edits a description cancels the validation run in progress,
# and a review bot edits the description each time it posts. ci.yml stays on
# the default types and keeps its own copies of these checks for the push case.
#
# `synchronize` is here although a push changes neither field: a required check
# has to exist on the head commit, and a workflow firing only on `opened` and
# `edited` leaves the newest commit with nothing to satisfy it.
#
# Both fields reach the scripts through the environment, never through
# interpolation into a `run` block. A title is attacker-controlled text on a
# pull request from a fork, and `${{ }}` substitution happens before the shell
# sees the line.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: metadata-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Squash-merge makes the pull request title the merge commit's subject, so
  # an unconventional title passes review and then fails lint:commit on every
  # later push to the target branch, on a commit message nobody can edit any
  # more. The check runs the repository's own commitlint over the subject the
  # title becomes, number included, rather than a second pattern that could
  # drift from commitlint.config.js.
  title:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs, not tags. A tag is a mutable
      # reference to code that runs with this repository's credentials.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
          # Only the working tree, because the title is not in the history.

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: corepack enable && corepack prepare --activate

      - run: npm ci

      - name: Lint the pull request title
        env:
          MERGE_REQUEST_TITLE: ${{ github.event.pull_request.title }}
          # GitHub's squash subject is the title followed by " (#N)", which can
          # carry a title that fits inside commitlint's length limit past it.
          MERGE_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: bash .gitlab/scripts/check-title.sh

  description:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs, not tags. A tag is a mutable
      # reference to code that runs with this repository's credentials.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
          # Both checks read this change's own commits as well as the
          # description, so its base has to be present.
          fetch-depth: 0

      # No Node setup and no install: both checks are shell over git and Vale.

      # The work is the author's. No commit or pull request description may
      # credit an AI tool as author, co-author or generator.
      - name: Check for AI attribution
        env:
          ATTRIBUTION_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_REQUEST_DESCRIPTION: ${{ github.event.pull_request.body }}
        run: bash .gitlab/scripts/check-attribution.sh

      # Project voice over the description and this change's commit messages.
      - name: Lint prose
        env:
          PROSE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_REQUEST_DESCRIPTION: ${{ github.event.pull_request.body }}
          PROSE_LINT_GLOB: '!.changeset/**'
        run: |
          bash .gitlab/scripts/install-vale.sh .vale/bin .vale/styles
          bash .gitlab/scripts/lint-prose.sh
